name: 'Build VSIX'
description: "Build the extension's VSIX"

inputs:
  node_version:
    description: 'Version of Node to install'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Install Node
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node_version }}
        cache: 'npm'

    # Minimum supported version is Python 3.10
    - name: Use Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Pip cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-build-vsix-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-build-vsix-

    - name: Upgrade Pip
      run: python -m pip install -U pip
      shell: bash

    # For faster/better builds of sdists.
    - name: Install build pre-requisite
      run: python -m pip install wheel
      shell: bash

    - name: Install nox
      run: python -m pip install nox
      shell: bash

    - name: Run npm ci
      run: npm ci --prefer-offline
      shell: bash

    - name: Install bundled python libraries
      run: python -m nox --session install_bundled_libs
      shell: bash

    # Use the GITHUB_RUN_ID environment variable to update the build number.
    # GITHUB_RUN_ID is a unique number for each run within a repository.
    # This number does not change if you re-run the workflow run.
    - name: Update extension build number
      run: python -m nox --session update_build_number -- $GITHUB_RUN_ID
      shell: bash

    - name: Build VSIX
      run: npm run vsce-package
      shell: bash

    - name: Verify bundled Bandit runtime in VSIX
      run: |
        python - <<'PY'
        import pathlib
        import zipfile

        archive_path = pathlib.Path("bandit.vsix")
        with zipfile.ZipFile(archive_path) as archive:
            names = set(archive.namelist())

        required = {
            "extension/bundled/libs/bandit/__init__.py",
            "extension/bundled/libs/bandit/formatters/sarif.py",
            "extension/bundled/libs/sarif_om/__init__.py",
        }
        missing = sorted(required - names)
        has_bandit_metadata = any(
            name.startswith("extension/bundled/libs/bandit-")
            and name.endswith(".dist-info/METADATA")
            for name in names
        )
        if not has_bandit_metadata:
            missing.append("extension/bundled/libs/bandit-*.dist-info/METADATA")
        if missing:
            raise SystemExit(
                "VSIX is missing required Bandit runtime files: " + ", ".join(missing)
            )
        print("Verified bundled Bandit metadata and SARIF support in bandit.vsix")
        PY
      shell: bash

    - name: Upload VSIX
      uses: actions/upload-artifact@v4
      with:
        name: linter-package
        path: |
          **/*.vsix
        if-no-files-found: error
        retention-days: 7
